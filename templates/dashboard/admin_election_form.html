{% extends 'base.html' %}
{% block content %}
<div class="admin-layout">

  <div class="admin-sidebar">
    <div class="sidebar-title">Admin Panel</div>
    <a href="{% url 'dashboard:admin_overview' %}">📊 Overview</a>
    <a href="{% url 'dashboard:admin_students' %}">👥 Students</a>
    <div class="sidebar-title">Elections</div>
    <a href="{% url 'dashboard:admin_elections' %}" class="active">🗳️ Elections</a>
    <a href="#">📋 Positions</a>
    <a href="#">🙋 Candidates</a>
    <a href="{% url 'dashboard:admin_campaigns' %}">📣 Campaigns</a>
    <div class="sidebar-title">Results</div>
    <a href="{% url 'dashboard:admin_elections' %}">🏆 Declare Winners</a>
    <a href="{% url 'dashboard:admin_achievements' %}">🌟 Achievements</a>
    <a href="{% url 'dashboard:admin_analytics' %}">📈 Analytics</a>
  </div>

  <div class="admin-content">
    <div class="mb-3">
      <a href="{% url 'dashboard:admin_elections' %}"
         class="btn btn-outline-kepler btn-sm">← Back to Elections</a>
    </div>

    <div class="kepler-card p-4" style="max-width:600px;">
      <h1 class="section-title mb-4">{{ action }} Election</h1>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="small-muted d-block mb-1">Election Name *</label>
          <input type="text" name="name" class="form-control"
                 value="{{ election.name|default:'' }}" required>
        </div>

        <div class="mb-3">
          <label class="small-muted d-block mb-1">Description</label>
          <textarea name="description" class="form-control"
                    rows="3">{{ election.description|default:'' }}</textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="small-muted d-block mb-1">Start Date & Time *</label>
            <input type="datetime-local" name="start_at" class="form-control"
                   value="{{ election.start_at|date:'Y-m-d\TH:i'|default:'' }}" required>
          </div>
          <div class="col-md-6">
            <label class="small-muted d-block mb-1">End Date & Time *</label>
            <input type="datetime-local" name="end_at" class="form-control"
                   value="{{ election.end_at|date:'Y-m-d\TH:i'|default:'' }}" required>
          </div>
        </div>

        <div class="mb-3 d-flex gap-4">
          <div class="form-check">
            <input type="checkbox" name="is_published" class="form-check-input"
                   id="is_published"
                   {% if election.is_published or not election %}checked{% endif %}>
            <label class="form-check-label small-muted" for="is_published">
              Published (visible to students)
            </label>
          </div>
          <div class="form-check">
            <input type="checkbox" name="allow_live_results"
                   class="form-check-input" id="allow_live_results"
                   {% if election.allow_live_results %}checked{% endif %}>
            <label class="form-check-label small-muted" for="allow_live_results">
              Allow live results during voting
            </label>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-kepler">
            {{ action }} Election
          </button>
          <a href="{% url 'dashboard:admin_elections' %}"
             class="btn btn-outline-kepler">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
