{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="kepler-card p-4 p-md-5 text-center">
      <div style="font-size:3rem;">📧</div>
      <h2 class="fw-800 mt-3 mb-2">Check your email</h2>
      <p class="small-muted mb-4">
        If an account exists with that email, we have sent a password
        reset link. Check your inbox and spam folder.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-outline-kepler">
        Back to Login
      </a>
    </div>
  </div>
</div>
{% endblock %}
