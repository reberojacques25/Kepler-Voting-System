{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="kepler-card p-4 p-md-5 text-center">
      <div style="font-size:3rem;">✅</div>
      <h2 class="fw-800 mt-3 mb-2">Password Reset Complete</h2>
      <p class="small-muted mb-4">
        Your password has been set. You can now log in with your new password.
      </p>
      <a href="{% url 'accounts:login' %}" class="btn btn-kepler">
        Log In Now
      </a>
    </div>
  </div>
</div>
{% endblock %}
