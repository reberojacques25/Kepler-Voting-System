{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="kepler-card p-4 p-md-5">
      <h2 class="fw-800 mb-1">Reset Password</h2>
      <p class="small-muted mb-4">
        Enter your email address and we will send you a link to reset your password.
      </p>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small-muted">Email Address</label>
          <input type="email" name="email" class="form-control"
                 placeholder="your@email.com" required>
        </div>
        <button type="submit" class="btn btn-kepler w-100">
          Send Reset Link
        </button>
      </form>
      <div class="small-muted mt-3 text-center">
        <a href="{% url 'accounts:login' %}">← Back to Login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
