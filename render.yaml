# One-click deploy on Render: Dashboard → New → Blueprint → pick this repo.
# Creates the web app and a PostgreSQL database and wires them together.
databases:
  - name: kepler-voting-db
    plan: free
    databaseName: kepler_voting
    user: kepler_voting

services:
  - type: web
    name: kepler-voting
    runtime: python
    plan: free
    region: frankfurt   # closest Render region to Kigali
    buildCommand: ./build.sh
    startCommand: gunicorn kepler_voting.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kepler-voting-db
          property: connectionString
      - key: DJANGO_SERVE_MEDIA
        value: "1"
      # Set these in the Render dashboard (they are secrets / site-specific):
      - key: SITE_URL            # e.g. https://kepler-voting.onrender.com
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_FROM_EMAIL
        sync: false
